name: Host Domain Tests

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S host_tests -B build/host_tests -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/host_tests --parallel

      - name: Test
        run: ctest --test-dir build/host_tests --output-on-failure
